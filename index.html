<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CYBER TERMINAL</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#020604;color:#20ff72;font-family:Consolas,monospace;min-height:100vh;overflow:hidden}
body:before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(0deg,rgba(32,255,114,.025) 0 1px,transparent 1px 4px);pointer-events:none}
.matrix{position:fixed;inset:0;opacity:.12;overflow:hidden;z-index:-1}
.matrix span{position:absolute;top:-100px;animation:fall linear infinite;white-space:pre;font-size:14px}
@keyframes fall{to{transform:translateY(120vh)}}
.wrap{width:min(1000px,94vw);margin:5vh auto;border:1px solid #20ff72;box-shadow:0 0 25px #20ff7240;padding:22px;background:#010302e8}
h1{text-align:center;margin:0 0 8px;font-size:clamp(26px,6vw,54px);text-shadow:0 0 14px #20ff72}
.skull{text-align:center;font-size:clamp(38px,8vw,70px);line-height:1.1}
.sub{text-align:center;color:#9affb9;margin-bottom:22px}
.panel{border:1px solid #167a3d;padding:18px;background:#020704}
label{display:block;margin-bottom:8px}
input{width:100%;background:#000;color:#20ff72;border:1px solid #20ff72;padding:13px;font:inherit;outline:none;box-shadow:0 0 10px #20ff7230}
input:focus{box-shadow:0 0 16px #20ff7260}
button{margin-top:12px;background:#20ff72;color:#001b09;border:0;padding:11px 18px;font:inherit;font-weight:bold;cursor:pointer}
button:hover{box-shadow:0 0 15px #20ff72}
.output{margin-top:18px;min-height:150px;border:1px solid #167a3d;padding:14px;white-space:pre-wrap;overflow:auto}
a.cyberlink{display:inline-block;margin-top:16px;color:#20ff72;border:1px solid #20ff72;padding:12px 16px;text-decoration:none}
a.cyberlink:hover{background:#20ff72;color:#001b09}
.hint{color:#74b88c;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="matrix" id="matrix"></div>
<div class="wrap">
  <div class="skull">☠</div>
  <h1 id="title">CYBER TERMINAL</h1>
  <div class="sub">SECURE ACCESS // ONLINE</div>

  <div class="panel">
    <label for="text">Ganti tulisan link:</label>
    <input id="text" value="MASUK KE TERMINAL" maxlength="60">
    <button onclick="changeText()">UBAH TULISAN</button>
    <br>
    <a id="link" class="cyberlink" href="#terminal">MASUK KE TERMINAL</a>
    <div class="hint">Kamu bisa mengetik tulisan apa saja lalu tekan tombol.</div>
  </div>

  <div class="output" id="terminal">root@cyber:~$ system online
root@cyber:~$ ketik "help" untuk melihat command...</div>
</div>

<script>
function changeText(){
  const value=document.getElementById('text').value.trim() || 'MASUK KE TERMINAL';
  document.getElementById('link').textContent=value;
}
const m=document.getElementById('matrix');
const chars='01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&@';
for(let i=0;i<45;i++){
  const s=document.createElement('span');
  s.textContent=Array.from({length:18},()=>chars[Math.floor(Math.random()*chars.length)]).join('\\n');
  s.style.left=Math.random()*100+'%';
  s.style.animationDuration=(4+Math.random()*8)+'s';
  s.style.animationDelay=(-Math.random()*8)+'s';
  m.appendChild(s);
}
</script>
</body>
</html>
