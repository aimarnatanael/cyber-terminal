<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER TERMINAL</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #020604;
  color: #20ff72;
  font-family: Consolas, "Courier New", monospace;
  overflow: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    0deg,
    rgba(32,255,114,.035) 0px,
    rgba(32,255,114,.035) 1px,
    transparent 1px,
    transparent 4px
  );
  z-index: 10;
}

.matrix {
  position: fixed;
  inset: 0;
  overflow: hidden;
  opacity: .12;
  z-index: -1;
}

.matrix span {
  position: absolute;
  top: -200px;
  white-space: pre;
  font-size: 14px;
  animation: fall linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(130vh);
  }
}

.container {
  width: min(950px, 94vw);
  margin: 5vh auto;
  padding: 25px;
  border: 1px solid #20ff72;
  background: rgba(1,4,2,.92);
  box-shadow:
    0 0 20px rgba(32,255,114,.25),
    inset 0 0 20px rgba(32,255,114,.05);
}

.skull {
  text-align: center;
  font-size: 70px;
  text-shadow: 0 0 20px #20ff72;
}

h1 {
  margin: 0;
  text-align: center;
  font-size: clamp(28px, 6vw, 60px);
  text-shadow: 0 0 15px #20ff72;
}

.subtitle {
  text-align: center;
  margin: 10px 0 25px;
  color: #9affb9;
}

.panel {
  border: 1px solid #167a3d;
  padding: 20px;
  background: rgba(2,7,4,.9);
}

label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #20ff72;
  outline: none;
  background: #000;
  color: #20ff72;
  font-family: inherit;
  font-size: 16px;
}

input:focus {
  box-shadow: 0 0 15px rgba(32,255,114,.5);
}

button {
  margin-top: 12px;
  padding: 12px 20px;
  border: none;
  background: #20ff72;
  color: #001b09;
  font-family: inherit;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  box-shadow: 0 0 20px #20ff72;
}

.cyberlink {
  display: inline-block;
  margin-top: 20px;
  padding: 13px 18px;
  border: 1px solid #20ff72;
  color: #20ff72;
  text-decoration: none;
  font-weight: bold;
}

.cyberlink:hover {
  background: #20ff72;
  color: #001b09;
  box-shadow: 0 0 20px #20ff72;
}

.hint {
  margin-top: 12px;
  color: #74b88c;
  font-size: 13px;
}

.console {
  margin-top: 20px;
  padding: 18px;
  min-height: 130px;
  border: 1px solid #167a3d;
  color: #20ff72;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<div class="matrix" id="matrix"></div>

<div class="container">

  <div class="skull">☠</div>

  <h1>CYBER TERMINAL</h1>

  <div class="subtitle">
    SECURE ACCESS // ONLINE
  </div>

  <div class="panel">

    <label for="text">
      Ganti tulisan link:
    </label>

    <input
      id="text"
      type="text"
      value="MASUK KE TERMINAL"
      maxlength="60"
    >

    <button onclick="changeText()">
      UBAH TULISAN
    </button>

    <br>

    <!-- LINK MENUJU TERMINAL -->
    <a
      id="terminalLink"
      class="cyberlink"
      href="terminal.html"
      target="_blank"
    >
      MASUK KE TERMINAL
    </a>

    <div class="hint">
      Ketik tulisan yang kamu mau lalu tekan UBAH TULISAN.
      Tombol akan membuka terminal di tab baru.
    </div>

  </div>

  <div class="console">
root@cyber:~$ system online
root@cyber:~$ connection secure
root@cyber:~$ ketik "help" di terminal
  </div>

</div>

<script>

function changeText() {

  const input = document.getElementById("text");

  const link = document.getElementById("terminalLink");

  const value = input.value.trim();

  if (value === "") {
    link.textContent = "MASUK KE TERMINAL";
  } else {
    link.textContent = value;
  }

}


// MATRIX EFFECT

const matrix = document.getElementById("matrix");

const characters =
  "01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&@";

for (let i = 0; i < 50; i++) {

  const span = document.createElement("span");

  let text = "";

  for (let j = 0; j < 20; j++) {

    text +=
      characters[
        Math.floor(Math.random() * characters.length)
      ] + "\n";

  }

  span.textContent = text;

  span.style.left =
    Math.random() * 100 + "%";

  span.style.animationDuration =
    (4 + Math.random() * 8) + "s";

  span.style.animationDelay =
    (-Math.random() * 8) + "s";

  matrix.appendChild(span);

}

</script>

</body>
</html>
